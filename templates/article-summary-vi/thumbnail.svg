<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Article link becomes a narrated vertical summary video</title>
  <desc id="desc">An article card flows through three connected steps into a vertical video preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#182744"/>
      <stop offset="1" stop-color="#201a43"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#233657"/>
      <stop offset=".55" stop-color="#172843"/>
      <stop offset="1" stop-color="#101727"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6e65ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6e65ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9cc0ed" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020613" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#background)"/>
  <rect width="800" height="500" rx="24" fill="url(#grid)"/>
  <ellipse cx="561" cy="247" rx="290" ry="241" fill="url(#glow)"/>

  <rect x="38" y="34" width="174" height="28" rx="14" fill="#67e8f9" fill-opacity=".11" stroke="#67e8f9" stroke-opacity=".36"/>
  <circle cx="54" cy="48" r="4" fill="#67e8f9"/>
  <text x="67" y="53" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#b7f6ff">ARTICLE TO VIDEO</text>

  <g filter="url(#shadow)">
    <rect x="42" y="102" width="321" height="318" rx="20" fill="#f5f7fc"/>
    <rect x="42" y="102" width="321" height="49" rx="20" fill="#e7edf8"/>
    <path d="M42 131h321v20H42z" fill="#e7edf8"/>
    <circle cx="66" cy="126" r="5" fill="#85a6cf"/>
    <circle cx="83" cy="126" r="5" fill="#a7bcd7"/>
    <circle cx="100" cy="126" r="5" fill="#c2d0e0"/>
    <rect x="130" y="117" width="209" height="18" rx="9" fill="#fff"/>
    <text x="144" y="130" font-family="system-ui, sans-serif" font-size="9" fill="#7390b5">https://bai-viet.example</text>
    <text x="68" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#667d9a">NGUỒN CỦA BẠN</text>
    <text x="68" y="225" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#172842">Một bài viết dài.</text>
    <text x="68" y="261" font-family="system-ui, sans-serif" font-size="27" font-weight="800" fill="#172842">Những ý đáng nhớ.</text>
    <rect x="68" y="283" width="214" height="8" rx="4" fill="#bdcbe0"/>
    <rect x="68" y="303" width="264" height="8" rx="4" fill="#d5dfed"/>
    <rect x="68" y="323" width="239" height="8" rx="4" fill="#d5dfed"/>
    <rect x="68" y="343" width="168" height="8" rx="4" fill="#d5dfed"/>
    <rect x="68" y="376" width="114" height="24" rx="12" fill="#d6f5fb"/>
    <text x="83" y="392" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#176177">URL / ARTICLE</text>
  </g>

  <path d="M384 251h75" stroke="url(#shine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"/>
  <circle cx="423" cy="251" r="25" fill="#141d38" stroke="#76d6f7" stroke-opacity=".75" stroke-width="2"/>
  <path d="m415 251 6 6 11-13" fill="none" stroke="#80e7ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="480" y="48" width="266" height="414" rx="32" fill="#09101d" stroke="#a2b9dc" stroke-opacity=".52" stroke-width="2"/>
    <rect x="490" y="59" width="246" height="392" rx="25" fill="url(#screen)"/>
    <rect x="559" y="62" width="108" height="13" rx="7" fill="#09101d"/>
    <circle cx="688" cy="119" r="105" fill="#549bde" fill-opacity=".16"/>
    <circle cx="547" cy="263" r="86" fill="#8666d1" fill-opacity=".16"/>
    <path d="M503 247c67-42 129-11 220-85v164c-94-27-159 11-220 53z" fill="#264468" fill-opacity=".5"/>
    <rect x="511" y="98" width="74" height="20" rx="10" fill="#67e8f9" fill-opacity=".17"/>
    <text x="523" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9df3f8">01 / 03</text>
    <text x="513" y="197" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#81ecf7">TÓM TẮT</text>
    <text x="511" y="241" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#f7f9ff">3 ĐIỂM</text>
    <text x="511" y="284" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#f7f9ff">CHÍNH</text>
    <rect x="511" y="303" width="139" height="4" rx="2" fill="#a3b9d9" fill-opacity=".76"/>
    <rect x="511" y="316" width="185" height="4" rx="2" fill="#a3b9d9" fill-opacity=".42"/>
    <rect x="511" y="329" width="165" height="4" rx="2" fill="#a3b9d9" fill-opacity=".42"/>
    <rect x="511" y="368" width="205" height="44" rx="12" fill="#08111f" fill-opacity=".7" stroke="#7b9cc9" stroke-opacity=".25"/>
    <path d="M529 389v4m8-11v18m8-13v8m8-17v26m8-14v5m8-20v32m8-15v6m8-10v11m8-19v28m8-12v7m8-18v24m8-14v8m8-10v12m8-19v29m8-16v9m8-10v12m8-18v23" stroke="url(#shine)" stroke-width="3" stroke-linecap="round"/>
    <rect x="572" y="427" width="82" height="4" rx="2" fill="#dce8f9" fill-opacity=".44"/>
  </g>
  <path d="M30 480h740" stroke="#92a8d4" stroke-opacity=".17"/>
</svg>
